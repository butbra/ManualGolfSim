    <style>
        /* Leaderboard Styles */
        .leaderboard-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            color: #fff;
            font-size: 0.9em;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .leaderboard-table th {
            background-color: #222;
            color: #4db6ac;
        }
        .clear-btn {
            background-color: #d32f2f;
            font-size: 0.8em;
            padding: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="config-screen">
    
    <h1>Club Config</h1>
    
    <div style="margin-bottom: 15px; text-align: center;">
        <label for="profile-select" style="display: block; font-weight: bold; margin-bottom: 5px; color: #fff;">Player Profile</label>
        <select id="profile-select" onchange="loadProfileClubs()" style="width: 100%; max-width: 200px; padding: 10px; border-radius: 5px; background: #222; color: #fff; border: 1px solid #444; font-size: 1em;">
            <option value="brandon">Brandon</option>
            <option value="tyler">Tyler</option>
        </select>
    </div>

    <div style="margin-bottom: 20px; text-align: center;">
        <label for="round-length" style="display: block; font-weight: bold; margin-bottom: 5px; color: #fff;">Round Length & Mode</label>
        <select id="round-length" style="width: 100%; max-width: 200px; padding: 10px; border-radius: 5px; background: #222; color: #fff; border: 1px solid #444; font-size: 1em;">
            <option value="9">9 Holes</option>
            <option value="18">18 Holes</option>
            <option value="9-obstacles">9 Holes (Obstacles)</option>
            <option value="18-obstacles">18 Holes (Obstacles)</option>
        </select>
    </div>

    <p style="text-align: center; color: #aaa; font-size: 0.9em;">Set your standard distances.</p>
    
    <div class="config-grid" id="club-inputs"></div>

    <div class="toggle-container">
        <input type="checkbox" id="disable-driver" checked>
        <label for="disable-driver">Disable Driver</label>
        
        <input type="checkbox" id="disable-3wood" checked>
        <label for="disable-3wood">Disable 3 Wood</label>
    </div>
    
    <button class="primary" onclick="startGame()">Save & Start Round</button>

    <div class="leaderboard-section">
        <h2 style="text-align: center; color: #fff;">Course Records</h2>
        <table class="leaderboard-table" id="leaderboard-table">
            <thead>
                <tr>
                    <th>Title / Note</th>
                    <th>Mode</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
        <div style="text-align: center;">
            <button class="primary clear-btn" onclick="clearLeaderboard()">Clear Leaderboard</button>
        </div>
    </div>
</div>

<div class="container hidden" id="play-screen">
    <div class="hud">
        <div id="hole-info">Hole 1</div>
        <div id="par-info">Par 4</div>
        <div class="score" id="score-info">E</div>
    </div>

    <div style="text-align: center; font-size: 2.5em; font-weight: bold; color: #fff; margin: 10px 0 0 0;" id="distance-display">
        400y
    </div>
    
    <div id="hazard-display" style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 1.1em; height: 1.2em; text-transform: uppercase;"></div>

    <div class="hole-visual">
        <div class="flag">⛳</div>
        <div class="ball" id="ball-icon"></div>
    </div>

    <label class="section-title" for="club-select">Current Club</label>
    <select id="club-select"></select>
    
    <div id="target-power-display" style="text-align: center; color: #64b5f6; font-weight: bold; margin: 5px 0 15px 0; font-size: 0.95em; min-height: 1.2em;"></div>

    <label class="section-title">Direction</label>
    <div class="radio-group horizontal">
        <input type="radio" id="dir-3" name="direction" value="-3"><label class="color-red" for="dir-3">L</label>
        <input type="radio" id="dir-2" name="direction" value="-2"><label class="color-orange" for="dir-2">L</label>
        <input type="radio" id="dir-1" name="direction" value="-1"><label class="color-yellow" for="dir-1">L</label>
        <input type="radio" id="dir0" name="direction" value="0" checked><label class="color-green" for="dir0">-</label>
        <input type="radio" id="dir1" name="direction" value="1"><label class="color-yellow" for="dir1">R</label>
        <input type="radio" id="dir2" name="direction" value="2"><label class="color-orange" for="dir2">R</label>
        <input type="radio" id="dir3" name="direction" value="3"><label class="color-red" for="dir3">R</label>
    </div>

    <label class="section-title">Contact</label>
    <div id="contact-container"></div>

    <button class="primary" onclick="hitShot()">SWING</button>

    <div class="log" id="shot-log">Round Started.</div>
</div>

<script src="script.js"></script>
</body>
</html>
